<script>
    const audio = new Audio();
    const btn = document.getElementById('playBtn');
    const state = document.getElementById('state');
    const selector = document.getElementById('selector');

    let playing = false;

    audio.crossOrigin = "anonymous";

    btn.onclick = () => {
        if (!playing) {
            conectarRadio();
        } else {
            detenerRadio();
        }
    };

    function conectarRadio() {
        state.innerText = "CONECTANDO...";
        audio.src = selector.value;
        audio.load(); 
        
        const playPromise = audio.play();

        if (playPromise !== undefined) {
            playPromise.then(() => {
                playing = true;
                state.innerText = "🔴 EN VIVO";
                btn.innerText = "PAUSAR";
                btn.style.background = "#ef4444";
                btn.style.color = "white";
            }).catch(error => {
                console.error("Error de carga:", error);
                state.innerText = "URL NO DISPONIBLE";
                playing = false;
            });
        }
    }

    function detenerRadio() {
        audio.pause();
        audio.src = ""; // Truco para resetear el streaming vivo
        playing = false;
        state.innerText = "PAUSADO";
        btn.innerText = "REPRODUCIR";
        btn.style.background = "#38bdf8";
        btn.style.color = "#0f172a";
    }

    // Cambiar emisora automáticamente al seleccionar
    selector.onchange = () => {
        if(playing) {
            conectarRadio();
        }
    };

    // Eventos de red para informar al usuario
    audio.addEventListener('waiting', () => {
        if(playing) state.innerText = "CARGANDO SEÑAL...";
    });

    audio.addEventListener('playing', () => {
        state.innerText = "🔴 EN VIVO";
    });

    audio.addEventListener('error', () => {
        state.innerText = "ERROR EN EMISORA";
        detenerRadio();
    });
</script>
